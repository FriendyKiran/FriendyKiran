<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
<title id="t">Agentic RAG over KGs</title>
<desc id="d">Query-routing layer that sends each question to one of 3 fine-tuned knowledge-graph retrievers, scored against a held-out eval set. Result: 98.7% Recall@5.</desc>
