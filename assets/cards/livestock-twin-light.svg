<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
<title id="t">Livestock Digital Twin</title>
<desc id="d">Agent-based simulation fed by live MQTT sensor streams, tracking per-animal energy by the minute and forecasting monthly methane. Result: 1 min per-animal resolution.</desc>
<defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0079a3"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0079a3" stop-opacity="0"/><stop offset="0.5" stop-color="#0079a3"/><stop offset="1" stop-color="#0079a3" stop-opacity="0"/></linearGradient><style>
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style></defs>
<rect x="0.5" y="0.5" width="599" height="249" rx="16" fill="#ffffff" stroke="#d8e1eb"/>
<rect x="40" y="0.5" width="200" height="2" fill="url(#edge)"><animate attributeName="x" values="-200;600" dur="5s" repeatCount="indefinite"/></rect>
<text x="28" y="40" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#0079a3" letter-spacing="1">RESEARCH · ANIMAL SCIENCE</text>
<text x="572" y="40" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#94a3b8">case study ↗</text>
<text x="28" y="80" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Livestock Digital Twin</text>
<text x="28" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">Agent-based simulation fed by live MQTT sensor</text><text x="28" y="141" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">streams, tracking per-animal energy by the minute</text><text x="28" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">and forecasting monthly methane.</text>
<rect x="28" y="208" width="61.8" height="24" rx="12" fill="#f1f5f9" stroke="#d8e1eb"/><text x="58.9" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#0f172a">Python</text><rect x="96.8" y="208" width="76.4" height="24" rx="12" fill="#f1f5f9" stroke="#d8e1eb"/><text x="135" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#0f172a">Mesa ABM</text><rect x="180.2" y="208" width="47.2" height="24" rx="12" fill="#f1f5f9" stroke="#d8e1eb"/><text x="203.8" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#0f172a">MQTT</text>
<circle cx="508" cy="118" r="46" fill="none" stroke="#f1f5f9" stroke-width="9"/><circle cx="508" cy="118" r="46" fill="none" stroke="#0079a3" stroke-width="9" stroke-dasharray="6 12" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 508 118" to="360 508 118" dur="16s" repeatCount="indefinite"/></circle><text x="508" y="125" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">1 min</text>
<text x="508" y="192" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="11" fill="#475569">per-animal resolution</text>
