<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">How I build retrieval systems</title>
<desc id="d">Animated trace of a RAG request: an agentic router sends each query to a knowledge graph, BM25, or FAISS retriever, then results are reranked with citations, answered by a LoRA fine-tuned LLM, and checked by an eval harness.</desc>
